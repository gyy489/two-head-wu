$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://two-head-wu.local/contracts/project-capability-bindings.schema.yaml"
title: "Project Capability Release Bindings"
type: object
additionalProperties: false
required: [schema_version, updated_at, policy, bindings]
properties:
  schema_version: { const: 1 }
  updated_at: { type: string }
  policy:
    type: object
    additionalProperties: false
    required:
      - opt_in
      - default_update_policy
      - automatic_update_requires_explicit_binding
      - discovery_does_not_grant_authorization
    properties:
      opt_in: { const: true }
      default_update_policy: { const: pinned }
      automatic_update_requires_explicit_binding: { const: true }
      discovery_does_not_grant_authorization: { const: true }
  bindings:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - project
        - capability
        - channel
        - update_policy
        - requirement
        - automatic
        - runtimes
        - interfaces
        - permission_digest
      properties:
        project: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        capability: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        channel: { enum: [stable, beta, candidate] }
        update_policy: { enum: [pinned, compatible, latest-stable] }
        requirement: { type: string, minLength: 1 }
        automatic: { type: boolean }
        runtimes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        interfaces:
          type: object
          minProperties: 1
          propertyNames:
            pattern: "^[a-z0-9]+(?:[.-][a-z0-9]+)*$"
          additionalProperties: { type: string, minLength: 1 }
        permission_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
      allOf:
        - if:
            properties:
              update_policy: { const: latest-stable }
          then:
            properties:
              channel: { const: stable }
