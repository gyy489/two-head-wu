$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://two-head-wu.local/contracts/documentation-registry.schema.yaml"
title: "Two-Headed-Wu Documentation and Project Navigation Registry"
type: object
additionalProperties: false
required: [version, updated_at, policy, groups, documents, modules]
properties:
  version:
    const: 1
  updated_at:
    type: string
  policy:
    type: object
    additionalProperties: false
    required: [public_entry, ai_entry, project_map, module_entry_name, generated_outputs]
    properties:
      public_entry: { type: string }
      ai_entry: { type: string }
      project_map: { type: string }
      module_entry_name: { type: string }
      generated_outputs:
        type: array
        items: { type: string }
  groups:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, title, purpose]
      properties:
        id: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        title: { type: string }
        purpose: { type: string }
  documents:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, path, kind, owner, authority, generated]
      properties:
        id: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        path: { type: string }
        kind: { enum: [introduction, navigation, policy, architecture, module-entry, specification, decision, report, inventory, runtime-guide, historical] }
        owner: { type: string }
        authority: { enum: [canonical, generated, contextual, historical] }
        generated: { type: boolean }
  modules:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, group, type, status, root, summary, overview, source_records, dependencies, interfaces, verification]
      properties:
        id: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        group: { type: string }
        type: { enum: [control-plane, subsystem, integration, data-boundary, runtime-state, governance] }
        status: { enum: [active, compatibility, planned, historical] }
        root: { type: string }
        summary: { type: string }
        overview: { type: string }
        source_records: { type: array, minItems: 1, items: { type: string } }
        dependencies: { type: array, items: { type: string } }
        interfaces: { type: array, items: { type: string } }
        verification: { type: array, minItems: 1, items: { type: string } }
