$schema: "https://json-schema.org/draft/2020-12/schema"
title: Two-Headed-Wu capability invocation result envelope
type: object
required:
  - schema_version
  - request_id
  - capability_id
  - requested_executor
  - actual_executor
  - remote_call_succeeded
  - mini_status
  - observed_at
properties:
  schema_version:
    const: 1
  request_id:
    type: string
    pattern: "^call-[a-f0-9]{24}$"
  job_id:
    type: string
    pattern: "^job-[a-z0-9-]+$"
  capability_id:
    type: string
    pattern: "^[a-z][a-z0-9-]*:[a-z][a-z0-9-]*$"
  requested_executor:
    enum: [air, mac-mini]
  actual_executor:
    enum: [air, mac-mini, none]
  remote_call_succeeded:
    type: boolean
  mini_status:
    enum: [online, offline, incompatible, unknown]
  fallback_reason:
    type: [string, "null"]
  state:
    enum: [queued, running, waiting_user, succeeded, failed]
  observed_at:
    type: string
    format: date-time
  output:
    type: [object, array, string, number, boolean, "null"]
  error:
    type: string
additionalProperties: false
