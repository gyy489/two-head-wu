$schema: "https://json-schema.org/draft/2020-12/schema"
title: Two-Headed-Wu task-scoped project delta
type: object
required: [schema_version, project_lease_id, entries]
properties:
  schema_version:
    const: 1
  project_lease_id:
    type: string
    pattern: "^project-[a-f0-9]{24}$"
  entries:
    type: array
    maxItems: 256
    items:
      type: object
      required: [path, operation, base_sha256]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
        operation:
          enum: [upsert, delete]
        base_sha256:
          type: [string, "null"]
          pattern: "^[a-f0-9]{64}$"
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        content_base64:
          type: string
      additionalProperties: false
additionalProperties: false
