runtime_compatibility:
  protocol_min: 2
  protocol_max: 2
  unknown_runtime: incompatible
  schema_fingerprint: required
  isolated_smoke_before_advertise: required
  fail_closed_for_remote_execution: true

project_bridge:
  modes: [review, workspace-write, full-project]
  default_mode: workspace-write
  maximum_delta_bytes: 8388608
  maximum_delta_entries: 256
  lease_seconds: 21600
  conflict_policy: reject-and-report
  credential_paths: forbidden

interaction_companion:
  automatic_terminal: enabled
  pending_only: true
  silence_is_approval: false
  cli_fallback: required

jobs:
  states:
    - queued
    - leased
    - running
    - waiting_user
    - uploading
    - succeeded
    - failed
    - cancelled
    - expired
  default_identity: owner-auto
  automatic_identity_members: [owner-primary, owner-secondary]
  automatic_identity_channels: [remote-work, openclaw-weixin]
  switch_boundary: new-task-or-message-only
  default_sandbox: workspace-write
  auto_apply_result: forbidden
  arbitrary_shell: forbidden
  maximum_capsule_bytes: 52428800
  maximum_result_bytes: 52428800
  result_retention_days: 14
  maximum_automatic_attempts: 3
  stale_lease_token_required: true
  replay_after_privileged_approval: owner-confirmation-required

artifacts:
  maximum_file_bytes: 52428800
  maximum_per_job: 10
  maximum_total_per_job_bytes: 52428800
  retention_days: 14
  credential_shaped_files: forbidden
  automatic_publication: forbidden
  automatic_result_application: forbidden

capsule:
  excluded_names:
    - .git
    - .env
    - .env.local
    - auth.json
    - node_modules
    - __pycache__
    - .venv
    - vendor
    - target
  excluded_suffixes:
    - .key
    - .pem
    - .p12
    - .pfx
  exclude_hidden_credential_patterns: true
